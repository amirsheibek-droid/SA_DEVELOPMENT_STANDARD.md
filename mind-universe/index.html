<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mind Universe</title>
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03040a">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--ar:'Amiri',serif;
  --blue:#4f7dff;--cyan:#2ee6ff;--green:#19f0b0;--purple:#a45cff;--gold:#ffc44d;--pink:#ff4fa8;--orange:#ff8a3d}
body.dark{--bg:#03040a;--ink:#eef1ff;--mute:#9aa3c7;--mute2:#6b7399;--line:rgba(160,175,255,.18);--glow:rgba(3,4,10,.85);--soft:rgba(255,255,255,.06)}
body.light{--bg:#eef2f8;--ink:#0b1730;--mute:#4a5872;--mute2:#7a879c;--line:rgba(31,107,255,.18);--glow:rgba(246,249,253,.92);--soft:rgba(31,107,255,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
body.dark{background:radial-gradient(120% 90% at 30% 20%,#0b0f24 0%,#05060f 50%,#020208 100%)}
body.light{background:radial-gradient(120% 90% at 30% 20%,#fff 0%,#eef2f8 55%,#e3e9f3 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#neural{position:fixed;inset:0;z-index:0}
.grad{background:linear-gradient(110deg,var(--cyan),var(--purple) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

/* gate */
.gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .9s,transform 1.2s cubic-bezier(.6,0,.2,1)}
.gate.gone{opacity:0;transform:scale(1.6);pointer-events:none}
.gate .eye{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.gate h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:800;letter-spacing:-.04em;margin:14px 0 10px;line-height:1}
.gate p{color:var(--mute);max-width:520px;line-height:1.6}
.gate input{margin-top:26px;width:min(320px,80vw);text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px;font-size:1.1rem;outline:none}
.gate input:focus{border-color:var(--cyan)}
.enter{margin-top:26px;position:relative;padding:18px 44px;border-radius:999px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#fff;background:linear-gradient(110deg,var(--blue),var(--purple) 55%,var(--pink));box-shadow:0 0 40px -6px rgba(164,92,255,.8)}
.enter::after{content:"";position:absolute;inset:-9px;border-radius:999px;border:1px solid rgba(46,230,255,.5);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.92);opacity:.9}to{transform:scale(1.25);opacity:0}}
.gate small{position:absolute;bottom:22px;left:0;right:0;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2)}
.sa-link{color:var(--cyan);text-decoration:none;border-bottom:1px solid currentColor}.sa-link:hover{color:#fff}

/* HUD */
.hud{position:fixed;z-index:30;opacity:0;transition:opacity .8s}
body.inside .hud{opacity:1}
.brand{top:16px;left:18px;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.06em;font-size:1.05rem}
.brand i{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--cyan),var(--purple),var(--pink),var(--gold),var(--green),var(--cyan));box-shadow:0 0 20px -2px rgba(164,92,255,.8);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{top:16px;right:16px;display:flex;gap:8px}
.chip{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* labels on neurons */
#labels{position:fixed;inset:0;z-index:12;pointer-events:none;visibility:hidden}
body.inside #labels{visibility:visible}
.nl{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 0;white-space:nowrap;transform-origin:8px 50%;will-change:transform,opacity}
.nl i{width:12px;height:12px;flex:0 0 12px;border-radius:50%;margin-left:-6px;background:#fff;box-shadow:0 0 0 2px var(--c),0 0 18px 4px var(--c)}
.nl span{font-family:var(--sans);font-size:1.05rem;font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.85),0 0 14px var(--bg),0 0 6px var(--bg)}
.nl.mini span{font-size:.92rem;font-weight:700}
.nl.near span,.nl.armed span{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.9),0 0 18px var(--bg),0 0 8px var(--c)}
.nl.armed i{transform:scale(1.45);box-shadow:0 0 0 3px var(--c),0 0 28px 8px var(--c)}
.nl:hover span{color:var(--c)}

/* stage: words without boxes */
#stage{position:fixed;z-index:20;left:46%;right:4vw;top:46%;transform:translateY(-50%);max-height:74vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;pointer-events:none;padding:26px 6px 40px;text-align:center;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 36px),transparent)}
#stage::-webkit-scrollbar{display:none}
#stage.live{pointer-events:auto}
#haze{position:fixed;z-index:15;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse 44% 70% at 72% 48%,var(--glow) 0%,transparent 100%)}
#haze.on{opacity:1}
.pg{display:none;position:relative}
.pg.on{display:block}
.pg > *{animation:emerge .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.pg.out > *{animation:retract .38s ease-in both}
@keyframes emerge{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.4);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes retract{to{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.3);filter:blur(8px)}}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--cyan));display:flex;align-items:center;justify-content:center;gap:10px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--cyan));box-shadow:0 0 12px 3px var(--c,var(--cyan))}
.pg h2{font-size:clamp(1.7rem,3.2vw,2.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:12px auto 10px;max-width:620px}
.pg h3{font-size:1.1rem;font-weight:800;margin:24px 0 6px}
.pg p{color:var(--mute);line-height:1.6;max-width:560px;margin:8px auto 0}
.lead{font-size:1.05rem}
.small{font-size:.85rem}
.link{display:inline-flex;align-items:center;gap:8px;margin:18px 10px 0;font-weight:700;color:var(--c,var(--cyan));position:relative;padding:3px 0}
.link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--c,var(--cyan)),transparent)}
.field{display:block;width:100%;max-width:520px;margin:14px auto 0;background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 4px;font-size:1rem;outline:none;text-align:center}
textarea.field{text-align:left;min-height:90px;resize:vertical;line-height:1.55}
.field:focus{border-color:var(--c,var(--cyan))}
.btn{display:inline-flex;align-items:center;gap:8px;margin:16px 6px 0;padding:12px 22px;border-radius:999px;font-weight:800;color:#fff;background:linear-gradient(110deg,var(--c,var(--blue)),var(--purple));box-shadow:0 10px 26px -12px var(--c,var(--blue))}
.ghost{display:inline-flex;align-items:center;gap:6px;margin:12px 6px 0;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ghost:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute2)}
.empty{font-family:var(--mono);font-size:.74rem;color:var(--mute2);margin-top:18px}

/* items that float on a thread rather than sit in boxes */
.thread{list-style:none;max-width:540px;margin:18px auto 0;position:relative;text-align:left;padding-left:30px}
.thread::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--c,var(--cyan)),transparent);opacity:.6}
.thread li{position:relative;padding:9px 0 9px 4px;line-height:1.45}
.thread li::before{content:"";position:absolute;left:-26px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px var(--dot,var(--c,var(--cyan))),0 0 10px 2px var(--dot,var(--c,var(--cyan)))}
.thread li.done{opacity:.5;text-decoration:line-through}
.thread li .meta{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);margin-top:3px}
.thread li .x{float:right;color:var(--mute2);font-size:.8rem;padding:0 4px}
.thread li .x:hover{color:var(--pink)}
.thread li input[type=checkbox]{accent-color:var(--green);margin-right:8px;transform:translateY(1px) scale(1.15)}

/* mood orbs */
.orbs{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 22px;margin:22px auto 6px;max-width:560px}
.orb{display:flex;flex-direction:column;align-items:center;gap:8px;width:70px}
.orb i{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--oc) 45%,transparent 72%);box-shadow:0 0 26px 2px var(--oc);transition:transform .25s;animation:float 5s ease-in-out infinite}
.orb:nth-child(2n) i{animation-delay:-1.4s}.orb:nth-child(3n) i{animation-delay:-2.8s}
.orb:hover i{transform:scale(1.15)}
.orb.sel i{transform:scale(1.22);box-shadow:0 0 0 3px #fff,0 0 36px 6px var(--oc)}
.orb span{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
@keyframes float{50%{transform:translateY(-6px)}}

/* rings for goals */
.ring{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c,var(--green)) calc(var(--p)*1%),var(--line) 0);margin:6px auto 0;position:relative}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;z-index:1;font-family:var(--mono);font-size:.9rem}
.goal{max-width:540px;margin:26px auto 0}
.goal h3{margin-top:8px}
.next{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--c,var(--green));margin-top:6px}

/* trackers */
.habit{max-width:520px;margin:20px auto 0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;text-align:left}
.habit b{font-size:1rem}
.habit .dots{grid-column:1/-1;display:flex;gap:6px}
.habit .dots i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.habit .dots i.on{background:var(--hc);box-shadow:0 0 8px var(--hc)}
.habit .dots i.over{background:#ff4f6d;box-shadow:0 0 8px #ff4f6d}
.habit .live{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);grid-column:1/-1}
.count{display:flex;align-items:center;gap:10px;font-family:var(--mono)}
.count button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hc);color:var(--hc);font-size:1.1rem;font-weight:700}

/* charts */
canvas.chart{width:100%;max-width:560px;height:220px;display:block;margin:16px auto 0}
.weekstrip{display:flex;gap:8px;max-width:560px;margin:14px auto 0}
.weekstrip b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.weekstrip i{display:block;width:100%;height:16px;border-radius:8px;background:var(--line)}
.mood-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:12px;max-width:640px;margin:8px auto 0}
.mood-grid canvas,#moodFlow{width:100%;background:rgba(8,12,28,.28);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
#moodWeek,#moodPie{height:200px}
#moodFlow{height:128px;display:block;max-width:640px;margin:12px auto 0}
#moodRead{max-width:560px;margin:12px auto;line-height:1.5}
@media(max-width:700px){.mood-grid{grid-template-columns:1fr}}
.stats{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:12px}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:1.8rem;font-weight:800;letter-spacing:-.03em}
.stats span{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2)}

/* hadith */
.ar{font-family:var(--ar);direction:rtl;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.9;margin:18px auto 6px;max-width:600px;color:var(--ink)}
.en{font-size:1.1rem;color:var(--ink)!important;font-style:italic}
.src{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);margin-top:12px}
.verify{font-family:var(--mono);font-size:.6rem;color:var(--orange);margin-top:8px}

/* gallery */
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px auto 0;max-width:600px}
.gal figure{position:relative;width:132px;height:132px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c,var(--pink)),0 0 22px -4px var(--c,var(--pink));animation:float 6s ease-in-out infinite}
.gal figure:nth-child(2n){animation-delay:-2s;margin-top:22px}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.gal figure button{position:absolute;top:6px;right:22px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;opacity:0;transition:.2s}
.gal figure:hover button{opacity:1}
.file{display:none}

/* drawing */
.drawwrap{position:relative;max-width:620px;margin:16px auto 0}
#pad{width:100%;height:340px;border-radius:24px;display:block;touch-action:none;background:radial-gradient(circle at 50% 40%,rgba(164,92,255,.08),transparent 70%);box-shadow:inset 0 0 0 1px var(--line)}
.swatches{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;background:var(--sc);box-shadow:0 0 10px var(--sc)}
.swatches button.sel{outline:2px solid var(--ink);outline-offset:2px}
#drawStudio .drawwrap{max-width:720px}
#drawStudio #pad{height:min(48vh,440px);cursor:crosshair}
.drow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.dstools button,.dsty button{font-size:.72rem;padding:8px 10px;border-radius:14px}
#drawStudio button.on{color:var(--pink,#ff6bd6);box-shadow:0 0 0 1px currentColor}
.dhint{font-size:.78rem;color:var(--mute,#8b93b8);text-align:center;margin-top:8px}
.dcol{width:36px;height:36px;border:0;background:transparent;padding:0;cursor:pointer}
.aiclip{margin:12px auto 0;text-align:center;max-width:340px}

/* dock: Neuron Pulse style — every neuron as a selectable light, unknown as ? */
#dock{position:fixed;z-index:21;left:0;right:0;bottom:0;transform:none;max-width:none;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));border-radius:0;background:linear-gradient(180deg,transparent,var(--glow) 36%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:none;opacity:0;pointer-events:none;transition:opacity .6s}
body.inside #dock{opacity:1;pointer-events:auto}
.dock-top{display:flex;justify-content:space-between;align-items:center;padding:0 16px 6px;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.dock-top b{color:var(--cyan)}
.dock-row{display:flex;gap:4px;overflow-x:auto;padding:4px 14px 2px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dock-row::-webkit-scrollbar{display:none}
.dk{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0;border-radius:12px;scroll-snap-align:start}
.dk:hover{background:var(--soft)}
.dk i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-weight:800;font-size:.95rem;color:var(--c,#cfd6ff);background:none;box-shadow:inset 0 0 0 1.5px var(--c,#cfd6ff),0 0 14px -4px var(--c,#cfd6ff)}
.dk.found i{position:relative;color:transparent;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 50%,transparent 75%);box-shadow:0 0 14px -2px var(--c);font-size:0}
.dk.found i::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c)}
.dk.here i{transform:scale(1.12);box-shadow:0 0 0 2px var(--ink),0 0 18px 2px var(--c)}
.dk span{font-family:var(--mono);font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.2;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk.unk span,.dk:not(.found):not(.fly) span{color:var(--mute2)}
.dk.fly i{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 0 16px -4px var(--purple);font-size:1rem}
.dk.fly.found i::after{display:none;content:none}
.dk.worlds i{background:linear-gradient(135deg,#19f0b0,#7fe0c3);color:#04241a!important;box-shadow:0 0 16px -4px #7fe0c3;font-size:.78rem!important;font-weight:800}
.dk.worlds.found i::after{display:none;content:none}
.dk.mini{width:50px}
.dk.mini i{width:28px;height:28px;font-size:.8rem}
#readout{position:fixed;z-index:34;left:50%;bottom:96px;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);opacity:0;transition:opacity .3s;white-space:nowrap;text-shadow:0 0 8px var(--bg)}
#readout.on{opacity:1}
#toast{position:fixed;z-index:36;left:50%;bottom:124px;transform:translate(-50%,10px);font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(8px);opacity:0;transition:.5s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.care{max-width:520px;margin:18px auto 0;font-size:.88rem;color:var(--mute);line-height:1.6}
.care b{color:var(--ink)}


/* ── travel: the electron screen with % ── */
#electron{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .45s}
#electron.on{opacity:1}
.atom{width:min(44vw,230px);height:min(44vw,230px)}
.atom svg{width:100%;height:100%;overflow:visible}
.atom .orbit{fill:none;stroke:var(--c1,rgba(46,230,255,.6));stroke-width:1.2}
.atom .orbit.b{stroke:rgba(164,92,255,.65)}.atom .orbit.c{stroke:rgba(255,79,168,.6)}
.atom .nuc{fill:#fff;filter:drop-shadow(0 0 10px var(--cyan)) drop-shadow(0 0 22px var(--purple))}
.atom .spin{transform-origin:125px 125px;animation:spin 1.6s linear infinite}
.atom .spin.b{animation-duration:1.1s;animation-direction:reverse}.atom .spin.c{animation-duration:2.2s}
.atom .el{fill:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}.atom .el.b{fill:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}
.e-count{font-family:var(--mono);font-weight:700;font-size:clamp(2.6rem,8vw,4.2rem);margin-top:16px;text-shadow:0 0 18px var(--bg)}
.e-count small{font-size:.4em;color:var(--mute)}
.e-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin-top:6px;text-align:center;padding:0 20px}
.e-log{font-family:var(--mono);font-size:.7rem;color:var(--mute);margin-top:12px;height:3.6em;overflow:hidden;text-align:center;line-height:1.2em}
.e-rain{position:fixed;top:0;bottom:0;width:13vw;font-family:var(--mono);font-size:.68rem;line-height:1.25;color:rgba(46,230,255,.35);overflow:hidden;white-space:pre;padding:10px}
.e-rain.l{left:0}.e-rain.r{right:0;text-align:right;color:rgba(255,79,168,.35)}
@media(max-width:780px){.e-rain{width:20vw;font-size:.58rem}}
/* ── sound ── */
#soundMenu{max-height:76vh;overflow-y:auto;position:fixed;z-index:38;top:58px;right:16px;display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:18px;background:var(--glow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.25s;min-width:220px}
#soundMenu.on{opacity:1;transform:none;pointer-events:auto}
#soundMenu .h{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute2);padding:4px 10px 6px}
#soundMenu button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;font-size:.9rem}
#soundMenu button:hover{background:var(--soft)}
#soundMenu button i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cyan)}
#soundMenu button[aria-pressed=true]{color:var(--cyan)}
#soundMenu button[aria-pressed=true] i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#soundMenu .vol{display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:var(--mono);font-size:.62rem;color:var(--mute)}
#soundMenu input[type=range]{flex:1;accent-color:var(--cyan)}
/* ── goals floating in the page too ── */
.gfloat{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 40px;margin:26px auto 0;max-width:640px}
.gorb{width:170px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:float 6s ease-in-out infinite}
.gorb:nth-child(2n){animation-delay:-2s;margin-top:26px}.gorb:nth-child(3n){animation-delay:-4s}
.gorb .ring{width:110px;height:110px;box-shadow:0 0 30px -6px var(--c,var(--purple))}
.gorb h3{margin:12px 0 2px;font-size:1rem}
.gorb .next{font-size:.66rem}
.gorb .steps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.gorb .steps button{padding:5px 10px;border-radius:999px;font-size:.72rem;box-shadow:inset 0 0 0 1px var(--line)}
.gorb .steps button.done{background:var(--c,var(--purple));color:#fff;box-shadow:0 0 12px -2px var(--c,var(--purple));text-decoration:line-through}
.gorb input{font-size:.8rem!important;margin-top:8px!important}
.gorb .rm{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute2);margin-top:6px}

.dk.unk i,.dk:not(.found):not(.fly) i{display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-weight:800;font-size:.95rem;color:var(--c,#cfd6ff);background:none}
.nl.hid i{width:10px;height:10px;flex-basis:10px;margin-left:-5px;opacity:.95;background:none;box-shadow:inset 0 0 0 2px var(--c,#cfd6ff),0 0 16px 2px var(--c,#cfd6ff)}
.nl.hid span{font-family:var(--mono);font-size:1.7rem;font-weight:800;letter-spacing:0;color:var(--c,#cfd6ff);text-shadow:0 0 18px var(--c,#cfd6ff),0 0 8px #000}
.nl.pop i,.nl.pop span{animation:niIn .45s cubic-bezier(.2,.85,.2,1) both}
@keyframes niIn{from{opacity:0;transform:translateY(10px) scale(.55)}to{opacity:1;transform:none}}
.nl.world.hid span,.nl[data-go="worlds"].hid span{color:#7fe0c3}
.cr-btn.unk,.cr-q:not(.found){font-size:.9rem;font-weight:800;letter-spacing:0;color:var(--c,#9eb6ff);background:none}
.wh-map button{min-width:44px;width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.78rem}
.wh-map button.unk{font-size:1.05rem;letter-spacing:0;color:#cfd6ff}
.wh-map button span{display:none}
#whPath i.unk{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
#whPath i.unk::after{content:"?";font:800 .45rem var(--mono);color:var(--mute)}

/* ── free flight ── */
body.flying,body.flying #neural,body.flying #neural canvas{touch-action:none;-webkit-user-select:none;user-select:none}
#flyui{position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;transition:opacity .5s}
body.flying #flyui{opacity:1}
.cross{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(46,230,255,.55)}
body.flying.touching .cross{box-shadow:inset 0 0 0 2px var(--green),0 0 30px -6px var(--green)}
.flynear{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);white-space:nowrap;text-shadow:0 0 8px var(--bg)}
.flyhint{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:center;white-space:nowrap;text-shadow:0 0 8px var(--bg)}
.thrust{position:absolute;left:50%;bottom:148px;transform:translateX(-50%);pointer-events:auto;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;font-weight:700;color:#fff;background:radial-gradient(circle at 50% 40%,rgba(164,92,255,.9),rgba(79,125,255,.7));box-shadow:0 0 0 1.5px rgba(46,230,255,.5),0 0 34px -6px var(--purple);user-select:none;-webkit-user-select:none;touch-action:none}
.thrust.on{background:radial-gradient(circle at 50% 40%,#5bf3c4,#12b877);box-shadow:0 0 0 2px var(--green),0 0 50px 4px rgba(25,240,176,.6)}
.enter-pill{position:absolute;left:50%;top:calc(50% + 70px);transform:translateX(-50%);pointer-events:auto;padding:12px 22px;border-radius:999px;font-weight:800;color:#fff;background:linear-gradient(110deg,var(--blue),var(--purple) 60%,var(--pink));box-shadow:0 10px 30px -8px rgba(164,92,255,.8);white-space:nowrap}
.guide{position:fixed;left:0;top:0;z-index:23;pointer-events:none;opacity:0;transition:opacity .4s}
.guide.on{opacity:1}
.guide .g-ring{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--gold),0 0 24px 2px rgba(255,196,77,.5);animation:ping 1.6s ease-out infinite}
.guide .g-arrow{display:none;position:absolute;left:-14px;top:-14px;width:28px;height:28px;transform:rotate(var(--ang,0deg))}
.guide .g-arrow::before{content:"";position:absolute;left:4px;top:2px;border:10px solid transparent;border-bottom:16px solid var(--gold);filter:drop-shadow(0 0 6px rgba(255,196,77,.8))}
.guide.off .g-ring{display:none}.guide.off .g-arrow{display:block}
.guide span{position:absolute;left:0;top:36px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 8px var(--bg);font-weight:700}
#flyHelp{position:fixed;inset:0;z-index:37;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .4s}
#flyHelp.on{opacity:1;pointer-events:auto}
.fh-in{max-width:420px;text-align:center;padding:26px;border-radius:26px;background:var(--glow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line),0 30px 70px -30px var(--purple)}
.fh-in h3{font-size:1.5rem;font-weight:800;margin:8px 0}
.fh-in p{color:var(--mute);line-height:1.6;margin-top:6px}
@media(max-width:899px){
  .thrust{display:grid;bottom:calc(138px + env(safe-area-inset-bottom));width:96px;height:96px;z-index:24}
  .flyhint{white-space:normal;width:86vw;top:58px}
}

/* dock lights: found = glow, unknown = ? */
.dk.found i::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c)}
.dk.unk i::after,.dk.fly i::after,.dk:not(.found):not(.fly) i::after{content:none;display:none}
.dk.unk i,.dk:not(.found):not(.fly) i{position:relative;background:none}
.orb i{width:34px;height:34px;background:none;box-shadow:inset 0 0 0 1.5px var(--oc),0 0 18px -6px var(--oc);position:relative;animation:none}
.orb i::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--oc);box-shadow:0 0 10px var(--oc);transition:transform .25s}
.orb:hover i::after{transform:scale(1.6)}
.orb.sel i{transform:none;box-shadow:inset 0 0 0 2px var(--oc),0 0 26px -2px var(--oc)}
.orb.sel i::after{transform:scale(2)}
body.grabbing{cursor:grabbing}
/* games */
.gm{display:grid;grid-template-columns:repeat(4,64px);gap:10px;justify-content:center;margin:18px auto 0}
.gm button{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:1.6rem;color:var(--cc);transition:.25s}
.gm button span{opacity:0;transition:.25s}.gm button.up{box-shadow:inset 0 0 0 1.5px var(--cc),0 0 18px -4px var(--cc)}.gm button.up span{opacity:1}
.gs{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin:18px auto 0}
.gs button{height:70px;border-radius:16px;font:700 1.4rem var(--mono);box-shadow:inset 0 0 0 1.5px var(--purple),0 0 16px -6px var(--purple)}
.breath{position:relative;width:200px;height:200px;margin:22px auto 6px;display:grid;place-items:center}
.breath i{position:absolute;width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 2px var(--green),0 0 40px var(--green);transition:all 4s ease-in-out}
.breath i.p0,.breath i.p1{width:190px;height:190px}.breath b{position:relative;font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.scr{font:700 2rem var(--mono);letter-spacing:.2em;margin:20px auto 0}
.gcol{display:grid;gap:6px;width:min(300px,80vw);margin:18px auto 0}
.gcol button{aspect-ratio:1;border-radius:8px}

select.field{appearance:none;-webkit-appearance:none;cursor:pointer;text-align:center}
select.field option{color:#0b1730;background:#fff}
.react{display:block;width:min(320px,80vw);height:150px;margin:20px auto 0;border-radius:24px;font-weight:800;font-size:1.1rem;box-shadow:inset 0 0 0 1.5px var(--line)}
.react.wait{background:rgba(255,79,109,.25)}.react.go{background:rgba(25,240,176,.45);box-shadow:0 0 40px -6px var(--green)}
.simon{display:grid;grid-template-columns:repeat(2,96px);gap:12px;justify-content:center;margin:18px auto 0}
.simon button{height:96px;border-radius:22px;box-shadow:inset 0 0 0 2px var(--sc);opacity:.55;transition:.15s}
.simon button.on{opacity:1;background:var(--sc);box-shadow:0 0 36px var(--sc)}
.ttt{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin:18px auto 0}
.ttt button{height:72px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);font-size:1.8rem}
.sdk{display:grid;grid-template-columns:repeat(4,56px);gap:6px;justify-content:center;margin:18px auto 0}
.sdk b,.sdk input{height:56px;border-radius:12px;display:grid;place-items:center;font:700 1.3rem var(--mono);text-align:center;box-shadow:inset 0 0 0 1px var(--line);background:transparent;border:0;outline:none}
.sdk b{color:var(--gold)}
.sdk > :nth-child(4n+2){margin-right:8px}.sdk > :nth-child(n+5):nth-child(-n+8){margin-bottom:8px}
canvas.padlike{width:100%;height:320px;border-radius:24px;display:block;touch-action:none;box-shadow:inset 0 0 0 1px var(--line)}

.quest{display:inline-flex;align-items:center;gap:8px;margin:0 auto 12px;padding:6px 14px;border-radius:999px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,196,77,.45);background:rgba(255,196,77,.06)}
.quest i{font-style:normal}
.quest.done{color:var(--green);box-shadow:inset 0 0 0 1px rgba(25,240,176,.45);background:rgba(25,240,176,.06)}
.dk{position:relative}
.dk.q::before{content:"";position:absolute;top:0;right:14px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#coinChip{color:var(--gold)}

/* the mind window: web pages and videos float inside the universe */
#mwin{position:fixed;z-index:33;left:50%;top:50%;width:min(980px,92vw);height:min(640px,76vh);transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.8,.2,1);
  border-radius:22px;overflow:hidden;background:var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line),0 40px 90px -30px rgba(164,92,255,.7),0 0 60px -20px rgba(46,230,255,.5);display:flex;flex-direction:column}
#mwTitle::after{content:attr(data-left);margin-left:12px;color:var(--gold);font-weight:400}
#mwin.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#mwin.full{width:min(1280px,96vw);height:min(860px,92vh);z-index:41}
.mw-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.mw-bar a{color:var(--mute);margin-right:14px;text-decoration:none}.mw-bar button{font-size:.9rem;color:var(--mute)}
.mw-body{flex:1;position:relative}
.mw-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mw-note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mute);line-height:1.6}
.mw-note b{color:var(--ink);font-size:1.2rem;margin-bottom:8px}
.mw-search{padding:14px;overflow:auto;position:absolute;inset:0}
.mw-body canvas.playcv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#03040a;touch-action:none}
.playhud{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#9aa3c7;text-shadow:0 0 8px #03040a}
.playhud button{pointer-events:auto;color:#2ee6ff}
#mwin.playtv{box-shadow:0 0 0 10px #12162a,0 0 0 12px rgba(46,230,255,.35),0 40px 90px -20px rgba(46,230,255,.6)}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;max-width:640px;margin:18px auto 0}
.cab button,.cab a{min-height:86px;border-radius:14px;padding:12px 8px;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.35;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line),0 0 22px -10px var(--c,#ff4f6d);background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--c,#ff4f6d) 28%,transparent),transparent 72%)}
.cab button:hover,.cab a:hover{box-shadow:inset 0 0 0 1px var(--c,#ff4f6d),0 0 24px -6px var(--c,#ff4f6d)}
.grec{list-style:none;max-width:560px;margin:14px auto 0;text-align:left}
.grec li{padding:10px 4px;border-bottom:1px solid var(--line)}
.grec b{display:block;font-size:.92rem}
.grec span{display:block;color:var(--mute);font-size:.84rem;line-height:1.45;margin-top:3px}
.grec .tag{margin-top:4px}
@media(max-width:899px){#mwin{width:100vw;height:calc(100vh - 150px);top:52%;border-radius:18px 18px 0 0}}

/* Home: stats hovering beside the whole brain */
.hstats{display:flex;flex-direction:column;gap:6px;max-width:420px;margin:18px auto 0;text-align:left}
.hstat{display:grid;grid-template-columns:14px 1fr auto;grid-template-rows:auto 3px;column-gap:12px;row-gap:6px;align-items:center;padding:9px 6px;border-radius:12px;animation:float 7s ease-in-out infinite;transition:background .2s}
.hstat:hover{background:var(--soft)}
.hstat i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.hl{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hv{font-weight:700;font-size:.92rem}
.hb{grid-column:2/4;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.hb b{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);border-radius:3px}
.hmore{max-width:520px;margin:16px auto 0;text-align:center}
.hmore summary{cursor:pointer;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:8px;list-style:none}
.hmore summary::-webkit-details-marker{display:none}
.hmore[open] summary{color:var(--gold)}

/* ── the doorway into the Plan room: white floor in dark mode, black floor in light mode ── */
#room{position:fixed;inset:0;z-index:38;opacity:0;pointer-events:none;transition:opacity .6s;overflow:hidden;perspective:900px;
  --rbg:#f7f8fb;--rink:#0b1730;--rmute:#5a6680;--rline:rgba(11,23,48,.12)}
body.light #room{--rbg:#05060c;--rink:#eef1ff;--rmute:#9aa3c7;--rline:rgba(238,241,255,.14)}
#room.on{opacity:1;pointer-events:auto}
#room{background:radial-gradient(120% 80% at 50% 30%,var(--rbg) 40%,color-mix(in srgb,var(--rbg) 88%,#7f8cff) 100%);color:var(--rink)}
.r-floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:70%;transform-origin:50% 100%;transform:rotateX(78deg);
  background-image:linear-gradient(var(--rline) 1px,transparent 1px),linear-gradient(90deg,var(--rline) 1px,transparent 1px);background-size:80px 80px;
  -webkit-mask-image:linear-gradient(0deg,#000 20%,transparent 95%);mask-image:linear-gradient(0deg,#000 20%,transparent 95%);animation:floorMove 12s linear infinite}
@keyframes floorMove{to{background-position:0 80px}}
.r-horizon{position:absolute;left:0;right:0;top:44%;height:1px;background:linear-gradient(90deg,transparent,var(--rline),transparent)}
.r-in{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(620px,90vw);max-height:76vh;overflow:auto;text-align:center;padding:10px 6px;scrollbar-width:none}
.r-in h2{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:800;letter-spacing:-.035em;margin:8px 0 6px}
.r-in .r-eye{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rmute)}
.r-in p{color:var(--rmute);line-height:1.6}
.r-in .field{color:var(--rink);border-color:var(--rline)}
.r-items{list-style:none;margin:20px auto 0;max-width:480px;text-align:left}
.r-items li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rline);font-size:1.02rem}
.r-items li.done span{opacity:.4;text-decoration:line-through}
.r-items input{accent-color:#19b877;transform:scale(1.25)}
.r-items small{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rmute)}
.r-in h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--rmute);margin:26px 0 0;font-weight:500}
.r-out{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rmute)}
.r-out:hover{color:var(--rink)}
#door{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;perspective:1200px;display:flex;align-items:center;justify-content:center}
#door.on{opacity:1;pointer-events:auto}
.d-light{position:absolute;width:min(46vw,380px);height:min(78vh,640px);background:var(--rbg,#f7f8fb);box-shadow:0 0 120px 40px rgba(255,255,255,.55);border-radius:4px;transition:all 1s cubic-bezier(.6,0,.2,1)}
body.light .d-light{background:#05060c;box-shadow:0 0 120px 40px rgba(0,0,0,.5)}
.d-frame{position:relative;width:min(46vw,380px);height:min(78vh,640px);display:flex;box-shadow:0 0 0 10px #1a1f3a,0 0 60px -10px rgba(164,92,255,.8);border-radius:4px;transform-style:preserve-3d}
body.light .d-frame{box-shadow:0 0 0 10px #e8ecf5,0 0 60px -10px rgba(31,107,255,.5)}
.d-panel{flex:1;background:linear-gradient(160deg,#20264a,#121633);transition:transform 1.3s cubic-bezier(.65,0,.25,1);position:relative;backface-visibility:hidden}
body.light .d-panel{background:linear-gradient(160deg,#ffffff,#dfe6f3)}
.d-panel.l{transform-origin:0 50%;border-right:1px solid rgba(255,255,255,.08)}.d-panel.r{transform-origin:100% 50%}
.d-panel i{position:absolute;top:50%;width:6px;height:46px;margin-top:-23px;border-radius:4px;background:linear-gradient(var(--gold),#b8841f);box-shadow:0 0 10px var(--gold)}
.d-panel.l i{right:14px}.d-panel.r i{left:14px}
#door.open .d-panel.l{transform:rotateY(-105deg)}#door.open .d-panel.r{transform:rotateY(105deg)}
#door.flood .d-light{width:100vw;height:100vh;border-radius:0}
#door.flood .d-frame{opacity:0;transition:opacity .4s}
.doorway{display:inline-flex;align-items:center;gap:10px;margin:20px auto 0;padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);position:relative}
.doorway::before{content:"";width:14px;height:20px;border-radius:2px;box-shadow:inset 0 0 0 2px var(--gold);background:linear-gradient(90deg,transparent 60%,rgba(255,196,77,.5) 60%)}

#voyPlayer{position:fixed;z-index:34;left:16px;bottom:96px;width:min(360px,80vw);border-radius:16px;overflow:hidden;background:var(--glow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--line),0 20px 50px -20px rgba(255,196,77,.6);opacity:0;pointer-events:none;transform:translateY(16px);transition:.5s}
#voyPlayer.on{opacity:1;pointer-events:auto;transform:none}
#voyPlayer.big{width:min(760px,92vw)}
.vp-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase}
.vp-bar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)}
.vp-bar button{margin-left:10px;color:var(--mute);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase}
.vp-body{position:relative;aspect-ratio:16/9}.vp-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
body.voyage #labels,body.voyage #stage,body.voyage #haze{opacity:0;pointer-events:none}
body.voyage #dock{opacity:.25}

/* other worlds: each universe hides the mind and uses its own path */
#worldLayer{position:fixed;inset:0;z-index:24;display:none;touch-action:none}
body.in-world #worldLayer{display:block}
body.in-world #neural,body.in-world #labels,body.in-world #stage,body.in-world #haze,body.in-world #dock,body.in-world #coreRail,body.in-world .hud.brand,body.in-world .thrust,body.in-world #flyHelp,body.in-world #enterPill,body.in-world #guide,body.in-world .flyhint,body.in-world .cross{opacity:0!important;pointer-events:none!important;visibility:hidden}
body.in-world #worldHud{display:flex}
#worldHud{position:fixed;inset:0;z-index:32;display:none;flex-direction:column;justify-content:space-between;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#worldHud > *{pointer-events:none}
#whExit,#whPrev,#whNext,#whFly,#whCard,#whPath{pointer-events:auto}
.wh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wh-top b{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 12px #000}
.wh-top span{display:block;font-size:.9rem;font-weight:800;margin-top:4px;text-shadow:0 0 10px #000}
.wh-exit,.wh-nav button,.wh-map button,#whCard button{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:rgba(8,12,28,.55);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.wh-map{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.wh-map button.here{box-shadow:inset 0 0 0 1px var(--cyan),0 0 14px -4px var(--cyan);color:var(--cyan)}
.wh-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#whCard{max-width:min(420px,78vw);background:rgba(8,12,28,.55);padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
#whCard b{display:block;font-size:.95rem;margin-bottom:4px}
#whCard p{color:var(--mute);font-size:.85rem;line-height:1.45;margin:0 0 8px}
.wh-nav{display:flex;gap:8px}
#whHint{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);text-align:center;text-shadow:0 0 8px #000}
#whPath{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}
#whPath button{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:none;letter-spacing:0}
#whPath button.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#whNext{background:rgba(46,230,255,.2);box-shadow:inset 0 0 0 1px var(--cyan),0 0 16px -6px var(--cyan);color:#fff}
#whFly{position:fixed;left:50%;bottom:148px;transform:translateX(-50%);z-index:5;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;font-weight:700;line-height:1.25;color:#fff;background:radial-gradient(circle at 50% 40%,rgba(164,92,255,.9),rgba(79,125,255,.7));box-shadow:0 0 0 1.5px rgba(46,230,255,.5),0 0 34px -6px var(--purple);touch-action:none;user-select:none}
#whFly.on{background:radial-gradient(circle at 50% 40%,#5bf3c4,#12b877);box-shadow:0 0 0 2px var(--green),0 0 50px 4px rgba(25,240,176,.6)}
.wh-bot{display:flex;flex-direction:column;align-items:center;gap:6px}
@media(max-width:899px){
  #whCard{max-width:92vw;padding:10px 12px}
  .wh-mid{flex-direction:column;align-items:stretch}
  #whFly{bottom:calc(138px + env(safe-area-inset-bottom));width:96px;height:96px}
}

#presence{display:inline-flex;align-items:center;gap:8px;color:var(--green)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:beat 1.6s infinite}
@keyframes beat{50%{opacity:.4}}

.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin:24px auto 0;perspective:900px}
.book{width:140px;height:200px;border-radius:4px 10px 10px 4px;padding:16px 12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#f5ead0;
  background:linear-gradient(90deg,rgba(0,0,0,.35) 0 8px,transparent 8px),linear-gradient(160deg,var(--bc),#0d0d14);box-shadow:0 18px 40px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,220,150,.25);transition:transform .35s;transform:rotateY(-14deg)}
.book:hover{transform:rotateY(0) translateY(-6px)}
.b-t{font-weight:800;font-size:.95rem;line-height:1.2;font-family:var(--ar),serif}
.b-a{font-size:.68rem;opacity:.8;line-height:1.3}
.b-l{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#ffc44d}

.sharechip{display:inline-flex;align-items:center;gap:6px;margin:0 6px 12px;padding:5px 12px;border-radius:999px;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.sharechip.on{color:var(--green);box-shadow:inset 0 0 0 1px rgba(25,240,176,.5);background:rgba(25,240,176,.06)}
.sharelist{max-width:420px;margin:12px auto 0;text-align:left}
.sharerow{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem}
.sharerow input{display:none}
.sharerow i{width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.sharerow i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sharerow input:checked + i{background:var(--green);box-shadow:0 0 12px -2px var(--green)}
.sharerow input:checked + i::after{left:19px}
.sharerow.off{opacity:.55;cursor:default}.sharerow em{font-style:normal;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2)}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:440px;margin:10px auto 0}
.grid30 button{aspect-ratio:1;border-radius:8px;font:600 .72rem var(--mono);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.grid30 button.on{background:#ffd27a;color:#2a1d00;box-shadow:0 0 12px -2px #ffd27a}

.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:460px;margin:16px auto 0}
.hc{border-radius:10px;padding:7px 2px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center}
.hc b{font:700 .95rem var(--mono)}.hc span{font-family:var(--mono);font-size:.5rem;color:var(--mute2);letter-spacing:.04em}
.hc.white{box-shadow:inset 0 0 0 1px rgba(127,224,195,.6),0 0 12px -4px #7fe0c3}
.hc.today{background:#7fe0c3;color:#04241a;box-shadow:0 0 16px -2px #7fe0c3}.hc.today span{color:#04241a}
#dock{padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))!important}

.rings{width:min(320px,80vw);margin:14px auto 4px;animation:float 8s ease-in-out infinite}
.rings svg{width:100%;height:auto;overflow:visible;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--line);stroke-width:9}
.rg{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);filter:drop-shadow(0 0 6px var(--c));animation:ringIn 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringIn{to{stroke-dashoffset:var(--off)}}
.rg-dot{fill:#fff;filter:drop-shadow(0 0 6px var(--c))}
.rg-big,.rg-small{transform:rotate(90deg);transform-origin:160px 160px;text-anchor:middle;fill:var(--ink)}
.rg-big{font:800 26px var(--sans)}.rg-small{font:500 10px var(--mono);fill:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.hstats{gap:2px}.hstat{padding:6px}

#intro{position:fixed;inset:0;z-index:37;display:flex;align-items:flex-end;justify-content:center;padding:24px 24px 110px;opacity:0;pointer-events:none;transition:opacity .5s}
#intro.on{opacity:1;pointer-events:auto}
.in-card{max-width:440px;text-align:center;padding:24px 26px;border-radius:24px;background:var(--glow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line),0 30px 70px -30px var(--purple)}
.in-card h3{font-size:1.4rem;font-weight:800;margin:8px 0 6px}.in-card p{color:var(--mute);line-height:1.6}
.in-dots{display:flex;justify-content:center;gap:6px;margin-top:14px}.in-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.in-dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

.hcore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:16px auto 6px}
.hc-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);transition:.2s}
.hc-btn:hover{box-shadow:inset 0 0 0 1px var(--c),0 0 18px -6px var(--c);transform:translateY(-2px)}
.hc-btn i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c);position:relative}
.hc-btn i::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.hc-btn span{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase}

/* albums: memories hover and drift in their own space; tap to enlarge */
.gal{position:relative;display:block!important;height:min(62vh,460px);max-width:640px;margin:18px auto 0}
.gal figure{position:absolute!important;margin:0!important;width:var(--s,120px)!important;height:var(--s,120px)!important;left:var(--x);top:var(--y);cursor:zoom-in;animation:drift var(--t,14s) ease-in-out infinite alternate!important;animation-delay:var(--dl,0s)!important}
@keyframes drift{0%{transform:translate(0,0) rotate(-3deg)}33%{transform:translate(var(--dx1),var(--dy1)) rotate(2deg)}66%{transform:translate(var(--dx2),var(--dy2)) rotate(-1deg)}100%{transform:translate(var(--dx3),var(--dy3)) rotate(3deg)}}
.gal figure:hover{z-index:2;box-shadow:0 0 0 2px #fff,0 0 30px -4px var(--c,var(--pink))}
.gal .empty{position:absolute;left:0;right:0;top:40%}
.ybar{position:relative;height:10px;max-width:560px;margin:28px auto 8px;border-radius:99px;background:linear-gradient(90deg,#ff4fa8,#ffd27a 40%,#2ee6ff 75%,#a45cff)}
.ybar span{position:absolute;top:16px;transform:translateX(-50%);font-family:var(--mono);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2)}
.ymonth{max-width:560px;margin:22px auto 0;text-align:left}
.ymonth h3{font-size:.95rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.ymonth .row{flex-wrap:wrap;justify-content:flex-start}
.ymem{width:88px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ymem img,.ymem video{width:76px;height:76px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 2px #ffd27a,0 0 16px -4px #ffd27a;cursor:zoom-in}
.ymem input{width:76px;font-size:.58rem;padding:2px;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit}
#lb{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,4,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s;cursor:zoom-out}
#lb.on{opacity:1;pointer-events:auto}
.lb-in{transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.2,.3,1)}#lb.on .lb-in{transform:scale(1)}
.lb-in img,.lb-in video{max-width:92vw;max-height:84vh;border-radius:18px;box-shadow:0 30px 80px -20px #000,0 0 0 1px rgba(255,255,255,.15);display:block}

/* floating TV choice: play in the mind, or open fully */
#tvAct{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:36;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(16px);transition:.35s}
#tvAct.on{opacity:1;pointer-events:auto;transform:none}
.tv-hud{width:min(420px,92vw);text-align:center;padding:16px 18px 14px;border-radius:22px;background:var(--glow);box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(46,230,255,.55)}
.tv-hud p{color:var(--mute);line-height:1.45;margin:0 0 4px}
body.watching #stage,body.watching #haze,body.watching #coreRail{opacity:.12;pointer-events:none}
body.watching #dock{opacity:.35}

/* vault: hovering glow keys in space — tap only, no hardware keyboard */
#vlock{position:fixed;inset:0;z-index:46;opacity:0;pointer-events:none;transition:opacity .45s;background:radial-gradient(ellipse 90% 80% at 50% 40%,rgba(46,230,255,.1),rgba(3,4,10,.88) 70%);perspective:1100px}
#vlock.on{opacity:1;pointer-events:auto}
.vk-hud{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));z-index:3;text-align:center;padding:0 16px;pointer-events:none}
.vk-hud h2{font-size:1.45rem;font-weight:800;margin:8px 0 6px;text-shadow:0 0 24px rgba(46,230,255,.45)}
.vk-hud p{color:var(--mute);line-height:1.5;max-width:380px;margin:0 auto}
.vk-hud .ghost{pointer-events:auto}
.vk-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;min-height:18px;margin:14px 0 0}
.vk-dots i{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);opacity:.18;transition:.15s}
.vk-dots i.on{opacity:1;transform:scale(1.2)}
.vk-space{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.vk-k{position:absolute;left:var(--x);top:var(--y);width:54px;height:54px;border-radius:50%;pointer-events:auto;touch-action:manipulation;font:800 .95rem var(--mono);color:#fff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 42%),radial-gradient(circle at 50% 55%,var(--g,#2ee6ff),#05070f 72%);box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 22px 2px var(--g,#2ee6ff),inset 0 -8px 16px rgba(0,0,0,.35);text-shadow:0 0 10px #fff;transform:translateZ(var(--z,0px));animation:vkHover var(--t,8s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);z-index:1}
.vk-k.wide{width:110px;border-radius:28px;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase}
.vk-k.go{width:64px;background:radial-gradient(circle at 35% 30%,#fff,transparent 40%),radial-gradient(circle at 50% 55%,#19f0b0,#2ee6ff 80%);color:#041018;box-shadow:0 0 28px 4px #19f0b0}
@media(max-width:699px){
  .vk-k{width:36px;height:36px;font-size:.72rem}
  .vk-k.wide{width:78px;font-size:.52rem}
  .vk-k.go{width:44px}
  .vk-hud h2{font-size:1.2rem}
}
@keyframes vkHover{from{transform:translate3d(0,0,var(--z,0px)) rotateY(-12deg)}to{transform:translate3d(var(--dx,8px),var(--dy,-14px),calc(var(--z,0px) + 28px)) rotateY(14deg)}}
.vk-k:active,.vk-k.hit{animation:none;transform:translateZ(40px) scale(1.18);background:var(--g,#2ee6ff);color:#041018;box-shadow:0 0 36px 8px var(--g,#2ee6ff);z-index:4}
#vlock.shake .vk-space{animation:vkShake .42s ease-in-out}
@keyframes vkShake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.vk-cancel{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;text-align:center}
.vseal{margin-top:18px}
.vseal > i{display:block;width:54px;height:54px;margin:0 auto 12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c,var(--cyan)),0 0 22px var(--c,var(--cyan));position:relative}
.vseal > i::before{content:"";position:absolute;left:50%;top:13px;width:16px;height:12px;margin-left:-8px;border:2.5px solid var(--c,var(--cyan));border-bottom:0;border-radius:10px 10px 0 0}
.vseal > i::after{content:"";position:absolute;left:50%;top:23px;width:22px;height:16px;margin-left:-11px;border-radius:4px;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan))}
.gal figure.sealed,.ymem.sealed figure{cursor:default}
.gal figure.sealed img,.gal figure.sealed video,.ymem.sealed img,.ymem.sealed video{filter:blur(14px) brightness(.45);pointer-events:none}
.vpadlock{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem;z-index:2;text-shadow:0 0 12px #2ee6ff}
.lockish{position:absolute;left:6px;bottom:6px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(3,4,10,.7);font-size:.72rem;display:grid;place-items:center}
.gal figure button.lockish{top:auto;right:auto;left:6px;bottom:6px;opacity:.85}
.ymem figure{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden}
.hc-btn .hclock{font-size:.7rem;line-height:1;opacity:.85}
.alb-lock{margin-left:4px;opacity:.8}
@media(max-width:899px){
  #stage{left:0;right:0;top:auto;bottom:86px;transform:none;max-height:58vh;padding:44px 20px 20px;
    background:linear-gradient(180deg,transparent 0,var(--glow) 60px,var(--glow) 100%);-webkit-mask-image:none;mask-image:none}
  #haze{display:none}
  .brand{font-size:.9rem}.brand i{width:24px;height:24px}
  #pad{height:280px}
  .chip,#dock,#toast,#soundMenu,.fh-in,#mwin,#voyPlayer,.in-card,#lb,#coreRail,#tvAct,.tv-hud{
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}

/* stay-and-explore rail: core pages + mystery ? lights */
#coreRail{position:fixed;z-index:22;left:max(8px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);
  width:86px;max-height:min(70vh,620px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  display:flex;flex-direction:column;gap:8px;padding:10px 8px;border-radius:22px;
  background:rgba(8,12,28,.28);box-shadow:inset 0 0 0 1px var(--line);
  opacity:0;pointer-events:none;transition:opacity .45s}
#coreRail::-webkit-scrollbar{display:none}
body.inside #coreRail{opacity:1;pointer-events:auto}
body.flying #coreRail,body.voyage #coreRail{opacity:.15;pointer-events:none}
.cr-lab{font-family:var(--mono);font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2);text-align:center;line-height:1.2}
.cr-sec{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-items:center}
.cr-div{height:1px;background:var(--line);margin:2px 4px}

      function chord(){ var t=c.currentTime, ch=prog[k++%prog.length];
        ch.forEach(function(fr,i){ [0,7].forEach(function(det){ var o=c.createOscillator(), v=c.createGain(); o.type='triangle'; o.frequency.value=fr*(i===3?2:1); o.detune.value=det-3;
          v.gain.setValueAtTime(.0001,t); v.gain.linearRampToValueAtTime(.035,t+2.2); v.gain.linearRampToValueAtTime(.03,t+6); v.gain.linearRampToValueAtTime(.0001,t+8.6); o.connect(v); v.connect(lp); o.start(t); o.stop(t+8.8); }); });
        timers.push(setTimeout(function(){ ping(ch[(Math.random()*4)|0]*4); },1800)); }
      chord(); timers.push(setInterval(chord,8000));
      var t0=c.currentTime; master.gain.cancelScheduledValues(t0); master.gain.setValueAtTime(master.gain.value,t0); master.gain.linearRampToValueAtTime(vol,t0+2.5); }
    function fadeChords(){ if(!ctx) return; var t=ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(0,t+.8); setTimeout(stopChords,900); }
    function playMine(){ return mGet('__music').then(function(rec){ if(!rec){ document.getElementById('sndFile').click(); return false; }
        if(!audio){ audio=new Audio(); audio.loop=true; } audio.src=URL.createObjectURL(rec.blob); audio.volume=vol; audio.play().catch(function(){}); return true; }); }
    var NAMES={off:'Sound off',mine:'My music'}; (window.MUAmb?MUAmb.list:[]).forEach(function(x){ NAMES[x.id]=x.name; });
    function set(m){ if(m==='mine') m='chords'; if(m==='mine'){ playMine().then(function(ok){ if(!ok) return; if(window.MUAmb) MUAmb.play('off'); mode='mine'; S.snd='mine'; save(); paint(); }); return; }
      if(audio){ audio.pause(); }
      if(window.MUAmb){ MUAmb.setVol(vol); MUAmb.play(m==='off'?'off':m); }
      mode=m; S.snd=m; save(); paint(); }
    function paint(){ document.querySelectorAll('[data-snd]').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.snd===mode); });
      document.getElementById('soundBtn').innerHTML='&#9835; '+(NAMES[mode]||'Sound'); }
    function setVol(v){ vol=v; S.vol=v; save(); if(audio) audio.volume=v; if(window.MUAmb&&mode!=='mine'&&mode!=='off') MUAmb.setVol(v); }
    return {set:set,paint:paint,setVol:setVol,mode:function(){ return mode; },vol:function(){ return vol; },
      useFile:function(file){ mPut({id:'__music',type:'music',name:file.name,blob:file,ts:Date.now()}).then(function(){ document.getElementById('mineName').textContent='My music: '+file.name.slice(0,22); set('mine'); }); }};
  })();
  function mGet(id){ return db().then(function(d){ return new Promise(function(res){ var q=d.transaction('m').objectStore('m').get(id); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ res(null); }; }); }); }
  var soundMenu=document.getElementById('soundMenu');
  document.getElementById('soundBtn').onclick=function(e){ e.stopPropagation(); soundMenu.classList.toggle('on'); };
  soundMenu.addEventListener('click',function(e){ var b=e.target.closest('[data-snd]'); if(!b) return; e.stopPropagation(); Snd.set(b.dataset.snd); });
  document.addEventListener('click',function(e){ if(!e.target.closest('#soundMenu,#soundBtn')) soundMenu.classList.remove('on'); });

  document.getElementById('sndVol').value=Math.round(Snd.vol()*100);
  document.getElementById('sndVol').oninput=function(){ Snd.setVol(this.value/100); };

  Snd.paint(); paintCoins();
  document.getElementById('coinChip').onclick=function(){ travelTo('me'); };
  document.getElementById('remindChip').onclick=function(){ travelTo('sage'); if(window.MUSage) MUSage.speakToday(); };


  /* ── sound effects (calm neuron pings) ── */
  var FX=function(n){ var a=[].slice.call(arguments,1); try{ window.SAFX&&SAFX[n].apply(null,a); }catch(e){} };
  function paintFx(){ var on=!(window.SAFX&&SAFX.isOff()); var b=document.querySelector('[data-fx]'); if(b) b.setAttribute('aria-pressed',on); document.getElementById('fxName').textContent='Neuron sounds '+(on?'on':'off'); }
  soundMenu.addEventListener('click',function(e){ var b=e.target.closest('[data-fx]'); if(!b) return; e.stopPropagation(); SAFX.setOn(SAFX.isOff()); paintFx(); FX('zoop'); });
  paintFx();

  /* ── flight soundtrack: a soft drone that rises with your speed ── */
  var FlySnd=(function(){ var ctx=null, g=null, lp=null, air=null, oscs=[], on=localStorage.getItem('mindu.flysnd')!=='off';
    // a warm, airy glide: soft wind plus a gentle shimmering chord that brightens as you speed up
    function start(){ if(!on) return; var C=window.AudioContext||window.webkitAudioContext; if(!C) return; if(!ctx) ctx=new C(); if(ctx.state==='suspended') ctx.resume(); if(g) return;
      g=ctx.createGain(); g.gain.value=0; lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=.5;
      var d=ctx.createDelay(1.5); d.delayTime.value=.42; var fb=ctx.createGain(); fb.gain.value=.4; d.connect(fb); fb.connect(d);
      lp.connect(g); lp.connect(d); d.connect(g); g.connect(ctx.destination);
      [261.6,329.6,392,587.3].forEach(function(f,i){ var o=ctx.createOscillator(), v=ctx.createGain(), l=ctx.createOscillator(), lg=ctx.createGain(); o.type='sine'; o.frequency.value=f; o.detune.value=(i-1.5)*5;
        v.gain.value=.12/(i+1); l.frequency.value=.08+i*.05; lg.gain.value=.05/(i+1); l.connect(lg); lg.connect(v.gain); o.connect(v); v.connect(lp); o.start(); l.start(); oscs.push(o,l); });
      var n=ctx.createBufferSource(), bf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), dd=bf.getChannelData(0), last=0; for(var i=0;i<dd.length;i++){ last=(last+.02*(Math.random()*2-1))/1.02; dd[i]=last*3; } n.buffer=bf; n.loop=true;
      air=ctx.createBiquadFilter(); air.type='bandpass'; air.frequency.value=700; air.Q.value=.6; var ag=ctx.createGain(); ag.gain.value=.5; n.connect(air); air.connect(ag); ag.connect(g); n.start(); oscs.push(n);
      var t=ctx.currentTime; g.gain.linearRampToValueAtTime(.06,t+1.5); }
    function stop(){ if(!g) return; var t=ctx.currentTime, gg=g, os=oscs; gg.gain.cancelScheduledValues(t); gg.gain.setValueAtTime(gg.gain.value,t); gg.gain.linearRampToValueAtTime(0,t+1.2); setTimeout(function(){ os.forEach(function(o){ try{ o.stop(); }catch(e){} }); },1300); g=null; oscs=[]; }
    function speed(v){ if(!g) return; var t=ctx.currentTime, k=Math.min(1,Math.abs(v)); lp.frequency.setTargetAtTime(900+k*2600,t,.4); air.frequency.setTargetAtTime(700+k*1400,t,.4); g.gain.setTargetAtTime(.06+k*.05,t,.4); }
    return {start:start,stop:stop,speed:speed,on:function(){ return on; },set:function(v){ on=v; localStorage.setItem('mindu.flysnd',v?'on':'off'); if(!v) stop(); else if(document.body.classList.contains('flying')) start(); }};
  })();
  function paintFlySnd(){ var b=document.querySelector('[data-flysnd]'); b.setAttribute('aria-pressed',FlySnd.on()); document.getElementById('flySndName').textContent='Flight sound '+(FlySnd.on()?'on':'off'); }
  soundMenu.addEventListener('click',function(e){ var b=e.target.closest('[data-flysnd]'); if(!b) return; e.stopPropagation(); FlySnd.set(!FlySnd.on()); paintFlySnd(); });
  paintFlySnd();

  /* ── free flight ── */
  var flyHelp=document.getElementById('flyHelp'), thrust=document.getElementById('thrust'), enterPill=document.getElementById('enterPill'), flyNear=document.getElementById('flyNear');
  var guideEl=document.getElementById('guide'), guideTxt=document.getElementById('guideTxt'), guideId=null, nearId=null, skip={}, thr=0;
  function isMob(){ return innerWidth<900; }
  function pickGuide(){ var from=byId[cur]||byId.me, best=null, bd=1e9;
    DESTS.forEach(function(d){ if(knownOf(d)||d.id==='me') return; var dx=d.pos[0]-from.pos[0], dy=d.pos[1]-from.pos[1], dz=d.pos[2]-from.pos[2], dd=dx*dx+dy*dy+dz*dz; if(dd<bd){ bd=dd; best=d.id; } }); return best; }
  function startFly(){ if(!document.body.classList.contains('inside')||busy) return; if(cur&&shown) skip[cur]=1; guideId=null;
    retract(function(){ if(!M.freeStart(null)) return; document.body.classList.add('flying'); FX('warp'); FlySnd.start();
      document.getElementById('flyHint').textContent='';
      paintDock(); }); }
  function endFly(keep){ document.body.classList.remove('flying','touching'); flyHelp.classList.remove('on'); thrust.classList.remove('on'); enterPill.hidden=true; nearId=null; flyNear.textContent=''; FlySnd.stop();
    if(keep){ try{ M.park(); }catch(e){} } else { try{ M.freeThrust(0); M.freeTurn(0); }catch(e){} } }
  document.getElementById('fhGo').onclick=function(){ localStorage.setItem('mindu.flyhelp','1'); flyHelp.classList.remove('on'); FX('zoop'); };
  M.onNear(function(){});
  enterPill.onclick=function(e){ e.stopPropagation(); if(nearId){ var id=nearId; skip[id]=1; travelTo(id); } };
  var drag=null;
  addEventListener('pointerdown',function(e){ if(!M.isFree()||e.target.closest('button,a,input,textarea,.nl,#dock,#coreRail,#flyHelp,#soundMenu,#stage,#tvAct')) return; drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now(),id:e.pointerId}; });
  addEventListener('pointermove',function(e){ if(!drag||e.pointerId!==drag.id) return; M.freeLook(e.clientX-drag.x,e.clientY-drag.y); drag.x=e.clientX; drag.y=e.clientY; });
  ['pointerup','pointercancel'].forEach(function(n){ addEventListener(n,function(e){ if(drag&&e.pointerId===drag.id){ var tap=n==='pointerup'&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<10&&Date.now()-drag.t<350; drag=null;
      if(tap&&!busy){ var hit=M.pickDest&&M.pickDest(e.clientX,e.clientY); if(hit){ tapNeuron(hit); return; } if(shown) retract(); } } }); });
  function hold(on){ M.freeThrust(on?1:0); thr=on?1:0; thrust.classList.toggle('on',on); }
  thrust.addEventListener('pointerdown',function(e){ e.preventDefault(); try{ thrust.setPointerCapture(e.pointerId); }catch(_){} hold(true); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){ thrust.addEventListener(n,function(){ hold(false); }); });
  var K={};
  function keys(){ var f=(K.w||K.arrowup||K[' '])?1:((K.s||K.arrowdown)?-.45:0); M.freeThrust(f); thr=f; thrust.classList.toggle('on',f>0); M.freeTurn((K.a||K.arrowleft)?1:((K.d||K.arrowright)?-1:0)); }
  addEventListener('keydown',function(e){ if(!M.isFree()||e.target.closest('input,textarea')) return; var k=e.key.toLowerCase(); if(k==='enter'&&nearId){ e.preventDefault(); enterPill.click(); return; } if(k==='escape'){ e.preventDefault(); if(shown) retract(); return; }
    if(['w','a','s','d',' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)<0) return; e.preventDefault(); K[k]=1; keys(); });
  addEventListener('keyup',function(e){ var k=e.key.toLowerCase(); if(K[k]){ delete K[k]; if(M.isFree()) keys(); } });
  addEventListener('keydown',function(e){ if(e.key!=='Escape') return; if(e.target.closest('input,textarea')) return; if(document.body.classList.contains('in-world')) return; if(room&&room.classList.contains('on')) return; if(shown){ e.preventDefault(); retract(); } });
  addEventListener('wheel',function(e){ if(M.isFree()) M.freeKick(-e.deltaY*.06); },{passive:true});
  setInterval(function(){ if(!M.isFree()) return; FlySnd.speed(thr); var n=M.nearest(); if(!n.id) return; var d=byId[n.id], known=knownOf(d);
    flyNear.textContent=known?d.name:'?';
    var close=n.dist<nextTo(d)&&!skip[n.id]; if(close){ nearId=n.id; enterPill.hidden=false; enterPill.innerHTML='·'; } else { nearId=null; enterPill.hidden=true; } },200);
  function moveGuide(){ if(visionOn()&&(!guideId||S.visited[guideId])) guideId=pickGuide(); var on=(M.isFree()||visionOn())&&guideId&&!S.visited[guideId]&&!flyHelp.classList.contains('on'); if(!on){ guideEl.classList.remove('on'); return; }
    var gs=M.screenOf(guideId), W=innerWidth, H=innerHeight, m=60, cx=W/2, cy=H/2, x=gs.x, y=gs.y, off=false;
    if(!gs.on){ x=cx+(cx-x)*1e3; y=cy+(cy-y)*1e3; }
    if(x<m||x>W-m||y<m+40||y>H-m-90||!gs.on){ off=true; var dx=x-cx, dy=y-cy, k=Math.min(Math.abs((cx-m)/(dx||1e-6)),Math.abs((cy-m-60)/(dy||1e-6))); x=cx+dx*k; y=cy+dy*k; guideEl.style.setProperty('--ang',(Math.atan2(dy,dx)*180/Math.PI+90).toFixed(1)+'deg'); }
    guideEl.classList.add('on'); guideEl.classList.toggle('off',off); guideEl.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
    guideTxt.textContent=''; }


  /* look around: drag anywhere on the universe to orbit the neuron you're at */
  (function(){ var od=null;
    addEventListener('pointerdown',function(e){ if(document.body.classList.contains('in-world')||M.isFree()||busy||!document.body.classList.contains('inside')) return; if(e.target.closest('button,a,input,textarea,select,.nl,#dock,#coreRail,#stage,#soundMenu,#flyHelp,#tvAct,canvas#pad,#drawStudio,.gate,#intro,#vlock,#worldHud,#worldLayer')) return; od={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now(),id:e.pointerId}; document.body.classList.add('grabbing'); });
    addEventListener('pointermove',function(e){ if(!od||e.pointerId!==od.id) return; M.orbit(e.clientX-od.x,e.clientY-od.y); od.x=e.clientX; od.y=e.clientY; });
    ['pointerup','pointercancel'].forEach(function(n){ addEventListener(n,function(e){ if(od&&e.pointerId===od.id){ var tap=n==='pointerup'&&Math.hypot(e.clientX-od.sx,e.clientY-od.sy)<6&&Date.now()-od.t<350; od=null; document.body.classList.remove('grabbing');
        if(!tap) return;
        if(tvAct&&tvAct.classList.contains('on')){ tvAct.classList.remove('on'); tvPick=null; return; }
        var hit=M.pickDest&&M.pickDest(e.clientX,e.clientY); if(hit){ tapNeuron(hit); return; }
        if(window.MUBook&&M.cam&&MUBook.pick(e.clientX,e.clientY,M.cam())){ MUBook.turn(e.clientX>innerWidth/2?1:-1); return; }
        var tv=M.pickTV&&M.pickTV(e.clientX,e.clientY); if(tv){ openTVChoice(tv); return; }
        if(document.body.classList.contains('watching')){ stopWatching(); return; }
        if(shown&&!busy&&!M.voyaging()) retract(); } }); });
  })();

  function initQuran(){ var sel=document.getElementById('qSurah'), box=document.getElementById('qRead'); if(!sel||!box) return;
    function load(){ var n=+sel.value||1; S.qSurah=n; save(); box.innerHTML='';
      fetch('https://api.alquran.cloud/v1/surah/'+n+'/editions/quran-uthmani,en.sahih').then(function(r){ return r.json(); }).then(function(j){
        var eds=(j.data||[]), ar=eds[0]&&eds[0].ayahs||[], en=eds[1]&&eds[1].ayahs||[];
        box.innerHTML=ar.map(function(a,i){ return '<div class="ar">'+a.text+'</div>'+(en[i]?'<p class="en">'+esc(en[i].text)+'</p>':'')+'<div class="src">'+n+':'+(a.numberInSurah|| (i+1))+'</div>'; }).join('');
      }).catch(function(){}); }
    sel.onchange=load; load();
  }
  function askMind(){ var inp=document.getElementById('aiAsk'); if(!inp) return; var t=(inp.value||'').trim(); if(!t) return;
    S.aiLog=S.aiLog||[]; S.aiLog.push({w:'me',t:t}); save();
    if(window.MUAI&&MUAI.handle){ MUAI.set({ctx:function(){ return ''; }, run:function(acts){ (acts||[]).forEach(function(a){
        if(a.op==='mood'&&a.m){ S.moods.unshift({m:a.m,note:a.note||'',ts:Date.now(),day:today()}); }
        if(a.op==='note'&&a.text){ S.notes.unshift({id:Date.now(),title:a.title||'',text:a.text,ts:Date.now()}); }
        if(a.op==='todo'&&a.text){ S.todos.unshift({id:Date.now(),text:a.text,done:false}); }
        if(a.op==='go'&&a.id) travelTo(a.id);
        if(a.op==='speak'&&window.MUSage) MUSage.speakToday();
      }); save(); return {say:''}; }});
      MUAI.handle(t,function(out){ var say=(out&&out.say)||'·'; S.aiLog.push({w:'bot',t:say}); save(); render('ai'); if(say&&say!=='·'&&window.MUSage) MUSage.speak(say); }); }
    else { S.aiLog.push({w:'bot',t:'·'}); save(); render('ai'); }
    inp.value='';
  }

  /* the gate */
  var gate=document.getElementById('gate'), gName=document.getElementById('gName');
  if(S.profile.name){ gName.value=S.profile.name; }
  function enter(){ var n=gName.value.trim(); if(n){ S.profile.name=n; save(); } gate.classList.add('gone'); Snd.set('chords');
    try{ speechSynthesis.cancel(); }catch(e){}
    M.enter(function(){ document.body.classList.add('inside'); cur='me'; M.setTheme(S.theme);
      M.setSeen(S.paths||[]); M.onPath(function(keys){ S.paths=(S.paths||[]).concat(keys); save(); toast('\u2726 New path explored'); });
      chartBoard=M.addBillboard('progress',chartCanvas,18,9,[0,13,0]); updateChartBoard();
      moodWeekBoard=M.addBillboard('mood',moodWeekCanvas,22,10,[0,16,8]);
      moodPieBoard=M.addBillboard('mood',moodPieCanvas,12,12,[16,7,-6]);
      moodFlowBoard=M.addBillboard('mood',moodFlowCanvas,24,8,[-4,5,14]);
      updateMoodBoards();
      refreshBoards(); refreshGoalOrbs(); refreshIdeaOrbs(); S.wishes.forEach(function(w,i){ addWishStar(i); });
      var last=S.moods[0]; if(last) M.setColor('mood',moodOf(last.m).c);
      window.MUSageSave=function(g){ S.sageVoice=g; save(); };
      if(window.MUSage) MUSage.boot(S.sageVoice);
      if(window.MUBook){ MUBook.boot(); MUBook.setNotes(S.notes); }
      setTimeout(function(){ M.fire('me'); emerge('me'); try{ localStorage.setItem('mindu.intro','1'); }catch(e){} },2300); }); }
  document.getElementById('gEnter').onclick=enter;
  gName.addEventListener('keydown',function(e){ if(e.key==='Enter') enter(); });
  setInterval(function(){ if(shown==='me') return; },60000);
  window.MUResumeMind=function(){ if(cur&&!shown) emerge(cur); };
})();
