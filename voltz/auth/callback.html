<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Voltz CRM…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;
      background:#f7fbff;color:#0f172a;padding:24px;text-align:center}
    a{color:#2563eb}
  </style>
</head>
<body>
<a href="/voltz/" class="vz-home" aria-label="Back to Voltz CRM home" style="position:fixed;top:14px;left:14px;z-index:999;display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:100px;background:rgba(255,255,255,.92);border:1px solid rgba(15,23,42,.1);box-shadow:0 8px 24px rgba(15,23,42,.12);text-decoration:none;color:#0f172a;font:800 15px/1 system-ui,-apple-system,sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)"><img src="/voltz/assets/voltz-icon.png" alt="" width="40" height="40" style="width:40px;height:40px;display:block"><span>&#8962; Voltz CRM home</span></a><div style="height:64px"></div>
  <main>
    <h1>Opening Voltz CRM…</h1>
    <p>If the app doesn’t open, <a id="fallback" href="#">tap here</a>.</p>
  </main>
  <script>
    (function () {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var deep = 'voltz://auth/callback' + q + h;
      var a = document.getElementById('fallback');
      if (a) a.setAttribute('href', deep);
      window.location.replace(deep);
    })();
  </script>
</body>
</html>
