<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Voltz CRM…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;
      background:#0a0e14;color:#e8f4f8;padding:24px;text-align:center}
    a{color:#00f0ff}
  </style>
</head>
<body>
  <main>
    <h1>Opening Voltz CRM…</h1>
    <p>If the app doesn’t open, <a id="fallback" href="#">tap here</a>.</p>
  </main>
  <script>
    (function () {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var deep = 'voltz://auth/callback' + q + h;
      var a = document.getElementById('fallback');
      if (a) a.setAttribute('href', deep);
      window.location.replace(deep);
    })();
  </script>
</body>
</html>
